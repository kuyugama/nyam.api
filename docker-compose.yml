

volumes:
  redis-data:
  postgres-data:

services:
  redis:
    container_name: "redis.nyam"
    image: redis:7
    volumes:
      - redis-data:/data

    restart: always

    healthcheck:
      test: redis-cli --raw ping | grep -q "PONG"
      interval: "1s"
      retries: 5

  postgres:
    container_name: "postgres.nyam"
    image: postgres:latest

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}

    volumes:
      - postgres-data:/var/lib/postgresql/

    restart: always

    healthcheck:
      test: pg_isready --dbname=${POSTGRES_DB} --user=${POSTGRES_USER}

      interval: "1s"
      retries: 5

  migrations:
    container_name: "migrations.nyam"
    depends_on:
      postgres:
        condition: service_healthy

    build:
      context: .
      dockerfile: Dockerfile

    command: "alembic upgrade head"

  dramatiq:
    container_name: "dramatiq.nyam"
    depends_on: &redis_and_migrations
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    build:
      context: .
      dockerfile: Dockerfile

    command: "dramatiq redis tasks"

    restart: always

  api:
    container_name: "api.nyam"
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    restart: always

    depends_on: *redis_and_migrations
